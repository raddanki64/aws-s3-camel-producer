spring:
  application:
    name: aws-s3-camel-publisher

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%-5level] [%thread] [%logger]: %msg%n"
  level:
    org.apache.camel: INFO

---
spring:
  profiles: development
  
camel:
  component:
    aws2-s3:
      accessKey: <aws_access_key>
      secretKey: <aws_secret_key>
      region: <aws_region>
      bucketName: <aws_bucket_name>
      
quartz2:
  initialDelay: 10000
  repetionCount: 10  

thread-pooling:
  core-pool-size: 25
  max-pool-size: 200

server:
  tomcat:
    accept-count: 100
    max-connections: 500
    max-threads: 200

maxMessagesPerTask: 10
